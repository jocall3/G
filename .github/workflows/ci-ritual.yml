name: CI Ritual

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy pytest

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars long.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format with black and isort
      run: |
        black --check .
        isort --check-only .

    - name: Type check with mypy
      run: |
        mypy .

    - name: Test with pytest
      run: |
        pytest

    - name: Security Scan (Example - Replace with actual tool)
      run: |
        echo "Running security scan..."
        # Example: Add a placeholder for a security scanning tool
        # For instance, you might use Bandit for Python security:
        # pip install bandit
        # bandit -r .
        # Or a general dependency scanner like Trivy:
        # trivy fs .
        echo "Security scan placeholder executed."